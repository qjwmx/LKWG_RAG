# Nginx 站点配置：前端静态文件 + /api 反代
# =============================================================================
#
# 由 deploy/install.sh --with-nginx 安装到 /etc/nginx/sites-available/lkwg-rag
# 并软链到 sites-enabled/。占位符 @APP_DIR@ / @APP_PORT@ / @SERVER_NAME@
# 在安装时替换成真实值。
#
# 手动安装：
#     sudo cp deploy/nginx/lkwg-rag.conf /etc/nginx/sites-available/lkwg-rag
#     sudo sed -i "s|@APP_DIR@|$(pwd)|g; s|@APP_PORT@|8000|g; s|@SERVER_NAME@|_|g" \
#          /etc/nginx/sites-available/lkwg-rag
#     sudo ln -sf /etc/nginx/sites-available/lkwg-rag /etc/nginx/sites-enabled/
#     sudo rm -f /etc/nginx/sites-enabled/default
#     sudo nginx -t && sudo systemctl reload nginx
#
# 用这套配置时，把 backend/.env 里的 SERVE_FRONTEND 设为 false——
# 前端由 Nginx 发，后端只做 API，职责更清晰。

# WebSocket/SSE 的 Connection 头映射。
# **必须放在 server 块之外**（http 上下文）：map 是 http 级指令，
# 写进 server 里会让 nginx -t 直接报 "map directive is not allowed here"。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name @SERVER_NAME@;

    # 上传上限。**必须 >= 后端 UPLOAD_MAX_MB**，否则大文件会在 Nginx 层被 413 挡掉，
    # 表现为"上传到一半就失败"，而后端日志里一条记录都没有。
    client_max_body_size 60m;

    # 访问日志里带耗时与上游耗时，排查"到底是前端慢还是后端慢"时很有用。
    access_log /var/log/nginx/lkwg-rag.access.log;
    error_log  /var/log/nginx/lkwg-rag.error.log warn;

    # 前端产物
    root @APP_DIR@/frontend/dist;
    index index.html;

    # gzip：JS/CSS 体积能压到 1/4 左右
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # ------------------------------------------------------------------ API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:@APP_PORT@;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 与 WebSocket 走 Upgrade 时不能丢这两行
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # ★ SSE 流式输出的关键三行
        #
        # 1) proxy_buffering off —— 默认是 on，Nginx 会攒满一个 buffer 才转发，
        #    于是"逐字吐字"变成"等十几秒然后一次性出现"。后端的
        #    X-Accel-Buffering: no 响应头能覆盖它，但那依赖后端每处 SSE 都记得加；
        #    在这里统一关掉更稳。
        # 2) proxy_cache off —— 问答响应绝不能被缓存。
        # 3) proxy_read_timeout 调大 —— 五 Agent 跑一轮可能几十秒，
        #    默认 60s 会在中途断开，前端表现为"回答到一半停住"。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 关掉 chunked 编码的分块，让数据尽快到达客户端
        chunked_transfer_encoding on;
    }

    # 后端接口文档（可选，对外提供服务时建议删掉这段）
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://127.0.0.1:@APP_PORT@;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------ 静态资源
    # Vite 产出的文件名带内容 hash，可以放心长缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html **不能缓存**：否则用户会一直拿到旧版本，而旧版本引用的
    # 带 hash 的资源文件已经被新构建删掉了 → 页面白屏。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA 兜底：/strategy、/admin/users 这些是前端路由，
    # 直接访问或刷新时服务端没有对应文件，必须回退到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
